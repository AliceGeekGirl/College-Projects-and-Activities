<!-- Indica ao navegador que este arquivo usa a versão mais recente do HTML (HTML5) -->
<!DOCTYPE html>

<!-- Tag principal que engloba todo o documento e define o idioma da página como inglês (en) -->
<html lang="en">

<!-- A tag <head> guarda as configurações e informações internas da página (que não aparecem diretamente na tela) -->
<head>
    <!-- Define a codificação de caracteres como UTF-8, garantindo que acentos e símbolos especiais sejam exibidos corretamente -->
    <meta charset="UTF-8">

    <!-- Configura a página para ajustar o tamanho da tela e o zoom corretamente em dispositivos móveis (celulares/tablets) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Define o título da página que aparece na aba do navegador -->
    <title>OpenBoard</title>

    <!-- Tag <link> que conecta a folha de estilos externa CSS ao documento HTML -->
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <!-- Importação do arquivo JavaScript externo com os comandos -->
    <!--O 'defer' avisa o navegador para baixar o arquivo, mas só rodá-lo depois que o HTML todo for carregado-->
    <script src="script.js" defer></script>
    <!-- Fecha a seção de configurações da página -->
</head>

<!-- A tag <body> contém todo o conteúdo visível da página (textos, imagens, botões, etc.) -->
<body>

    
</body>
</html>
